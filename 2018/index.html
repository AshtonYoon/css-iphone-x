<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920px, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible">
    <title>css iphonex</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="frame-base">
        <div class="frame-base-light"></div>
        <div class="side-button mute"></div>
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button hold"></div>
        <div class="stripe top"></div>
        <div class="stripe bottom"></div>
        <div class="port"></div>
        <div class="layer2">
            <div class="layer2-light"></div>
            <div class="layer2-light light-right"></div>
            <div class="screen">
                <img src="blurred.png" id="background">
                <img src="apple.svg" id="logo">
                <div class="mask">
                    <div class="left-pie"></div>
                    <div class="right-pie"></div>
                    <div class="speaker"></div>
                    <div class="camera">
                        <div class="lenz left"></div>
                        <div class="lenz right"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2026년에 추가: 원본 코드는 그대로 두고 이동 링크만 덧붙임 -->
    <a href="../2026/" style="position:fixed;top:24px;right:24px;z-index:10;padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:600 14px/1 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;text-decoration:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)">8년 후 결과물 (2026) &rarr;</a>
</body>
</html>
